
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-worker
spec:
  replicas: 1

  selector:
    matchLabels:
      app: llama-worker

  template:
    metadata:
      labels:
        app: llama-worker

    spec:
      containers:
        - name: llama-server
          image: llama-server-opt:local
          imagePullPolicy: Never

          args:
            - "--model"
            - "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--ctx-size"
            - "4096"
            - "--threads"
            - "2"
            - "--metrics"

          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "3Gi"

          volumeMounts:
            - name: model-volume
              mountPath: /models
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30

      volumes:
        - name: model-volume
          hostPath:
            path: /models
            type: Directory

